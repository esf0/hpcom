[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpcom"
version = "0.2.0.dev0"
authors = [
  { name = "Egor Sedov", email = "egor.sedoff@gmail.com" },
]
description = "High performance optical communication library"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pydantic>=2.6",
]

[project.optional-dependencies]
jax = ["jax>=0.4.30"]
jax-cuda = ["jax[cuda12]>=0.4.30"]
tf = ["tensorflow>=2.15"]
tf-gpu = ["tensorflow[and-cuda]>=2.15"]
# Pre-v1 modules under hpcom._legacy (deprecated; removed in v2).
legacy = [
  "tensorflow>=2.15",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "ssfm-gpu>=0.1.4",
]
docs = [
  "sphinx>=7",
  "furo>=2024.1",
  "sphinx-autodoc-typehints>=2",
]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "hypothesis>=6",
  "ruff>=0.4",
  "mypy>=1.8",
  "build>=1",
]

[project.urls]
Homepage = "https://github.com/esf0/hpcom"
"Bug Tracker" = "https://github.com/esf0/hpcom/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hpcom*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: integration tests that may take >5s (deselect with '-m \"not slow\"')",
  "gpu: tests that require a GPU-enabled TensorFlow install",
  "legacy: tests for the deprecated _legacy modules",
]
filterwarnings = [
  # hpcom must never warn in normal use; legacy modules warn by design.
  "error:::hpcom",
  "ignore::DeprecationWarning:hpcom._legacy",
  "ignore:hpcom._legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
  "src/hpcom/_legacy",
  "notebooks",
  "tests/legacy",
  "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# E501: line length handled by formatter; RUF001/2/3 flag Greek letters as
# "ambiguous" which is wrong for a physics library where α/β/γ/ω/τ are
# domain language. Keep them allowed.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/hpcom"]
exclude = ["src/hpcom/_legacy/.*"]

[[tool.mypy.overrides]]
module = "hpcom._legacy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tensorflow.*", "scipy.*", "ssfm_gpu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# tf.function is untyped (TensorFlow ships no stubs).
module = "hpcom.backends.tensorflow.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# JAX's stubs use Python 3.12 syntax; the project targets 3.10, so JAX is
# treated as untyped (the backend annotates its own arrays as Any).
module = ["jax", "jax.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hpcom.backends.jax.*"
disallow_untyped_decorators = false
