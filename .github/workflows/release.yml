name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel installs and imports
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --upgrade pip
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/python -c "import hpcom; print(hpcom.__version__ if hasattr(hpcom, '__version__') else 'ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI (dry-run gate)
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.ref, '-rc') || contains(github.ref, '-test')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hpcom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref, '-rc') && !contains(github.ref, '-test') }}
    environment:
      name: pypi
      url: https://pypi.org/p/hpcom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
