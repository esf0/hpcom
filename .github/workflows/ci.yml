name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev + tf extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tf]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Pytest (unit + numerical)
        run: python -m pytest tests/unit tests/numerical -q

  build-wheel:
    name: Build wheel + smoke install
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in clean venv and run example 02
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --upgrade pip
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/pip install "tensorflow>=2.15"
          /tmp/wheel-env/bin/python examples/02_ssmf_edfa_chain.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
